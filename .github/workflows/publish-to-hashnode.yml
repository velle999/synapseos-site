# Setup before this does anything:
#   1. Publishing through the API requires Hashnode Pro.
#   2. Generate a Personal Access Token at https://hashnode.com/settings/developer
#   3. Add it to this repo as the HASHNODE_PAT secret
#      (Settings -> Secrets and variables -> Actions).
#   4. Replace YOUR_BLOG.hashnode.dev below with your publication host.
#
# Until both are done the job SKIPS with a note rather than failing, so an
# unconfigured repo does not sit on a red X.

name: Publish to Hashnode

on:
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - '.github/workflows/publish-to-hashnode.yml'
  workflow_dispatch:

env:
  # Replace with your publication host, or swap to publication-id below.
  PUBLICATION_HOST: YOUR_BLOG.hashnode.dev

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        id: cfg
        env:
          PAT: ${{ secrets.HASHNODE_PAT }}
        run: |
          ready=true
          if [ -z "$PAT" ]; then
            echo "::notice::HASHNODE_PAT secret is not set — skipping publish."
            ready=false
          fi
          if [ "$PUBLICATION_HOST" = "YOUR_BLOG.hashnode.dev" ]; then
            echo "::notice::PUBLICATION_HOST is still the placeholder — skipping publish."
            ready=false
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          fetch-depth: 2

      - uses: Hashnode/publish-github-action@v1
        if: steps.cfg.outputs.ready == 'true'
        with:
          access-token: ${{ secrets.HASHNODE_PAT }}
          publication-host: ${{ env.PUBLICATION_HOST }}
          posts-directory: posts
